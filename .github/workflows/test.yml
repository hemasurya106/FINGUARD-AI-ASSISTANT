name: FINGUARD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ============================================================
# JOB 1 — Python / pytest (unit + integration)
# ============================================================
jobs:
  test:
    name: pytest (unit + Postgres integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_finguard   # isolated test DB, never touches prod
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job starts
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used ONLY by test_integration_postgres.py — all other tests use SQLite.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_finguard
      # Dummy key so the Gemini mock doesn't short-circuit on a missing-key guard
      GEMINI_API_KEY: ci-dummy-key-not-real

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install main dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r backend/tests/requirements-test.txt

      - name: Run pytest (unit + integration)
        # --tb=short keeps failure output readable in the CI log.
        # Coverage flags are picked up automatically from pyproject.toml addopts.
        run: pytest --tb=short -v

      - name: Upload coverage report
        if: always()   # upload even if tests fail, so you can inspect coverage on broken builds
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

# ============================================================
# JOB 2 — Playwright E2E (runs only after pytest job passes)
# ============================================================
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [test]   # only starts if the test job succeeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Python backend ----
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Start backend server
        env:
          GEMINI_API_KEY: ci-dummy-key-not-real
          # SQLite fallback — Playwright job has no Postgres service
          DATABASE_URL: sqlite:///./finguard_ci.db
        run: |
          uvicorn backend.api:app --host 0.0.0.0 --port 8000 &
          echo "Backend started (PID $!)"
          sleep 5   # Give uvicorn time to bind before wait-on polls

      # ---- Node / React frontend ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/pdis-dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/pdis-dashboard
        run: npm ci

      - name: Start frontend dev server
        working-directory: frontend/pdis-dashboard
        run: |
          npm start &
          echo "Frontend started (PID $!)"

      # ---- Wait for both servers to be ready before running any test ----
      # wait-on polls the URLs until they respond (or times out at 60s).
      # This eliminates the flaky "connection refused on first run" problem.
      - name: Wait for servers to be ready
        run: |
          npx wait-on \
            http://localhost:8000/docs \
            http://localhost:3000 \
            --timeout 120000 \
            --interval 2000 \
            --verbose

      # ---- Playwright ----
      - name: Install Playwright + browsers
        working-directory: frontend/pdis-dashboard
        run: |
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend/pdis-dashboard
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8000
        run: npx playwright test tests/e2e/ --reporter=list

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/pdis-dashboard/test-results/
